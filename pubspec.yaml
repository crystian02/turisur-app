name: turisur_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.12.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.2
  uuid: ^4.5.1
  geolocator: ^10.1.0
  fbroadcast: ^2.0.0
  supabase_flutter: ^2.5.2
  intl: ^0.18.1
  flutter_dotenv: ^5.0.0
  onesignal_flutter: ^5.0.0
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.0
  app_links: ^6.4.1
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  provider: ^6.1.5+1
  marquee: ^2.2.3
  flutter_foreground_task: ^8.0.4
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/car.png
    - assets/car_offline.png
    - assets/my_location_marker.png
    - assets/logo.png
    - assets/logoRMV.png
    - assets/background.jpeg
    - assets/icono.png
    - assets/icon/
    - .env